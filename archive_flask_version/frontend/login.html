<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Digital Urban Greenery Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="text-center">
            <div class="login-brand-icon">
                <i class="fa-solid fa-tree"></i>
            </div>
            <h3 class="fw-bold mb-1" style="color: #064e3b;">Urban Greenery</h3>
            <p class="text-muted small mb-4">Digital Environmental & Parks Management Portal</p>
        </div>

        <div id="loginError" class="alert alert-danger py-2 small d-none mb-3" role="alert"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label for="username" class="form-label small fw-semibold text-muted">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-user"></i></span>
                    <input type="text" class="form-control border-start-0" id="username" placeholder="e.g. admin or officer" required autofocus>
                </div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label small fw-semibold text-muted">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light text-muted border-end-0"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control border-start-0" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" checked>
                    <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                </div>
                <span class="badge bg-success-subtle text-success small">v1.0 Ready</span>
            </div>

            <button type="submit" class="btn btn-primary-green w-100 py-2 fw-semibold mb-3">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In to Portal
            </button>
        </form>

        <div class="border-top pt-3 text-center">
            <div class="text-muted small mb-2">Quick Demo Access:</div>
            <div class="d-flex gap-2 justify-content-center">
                <button type="button" class="btn btn-sm btn-outline-success" onclick="fillDemoCredentials('admin')">
                    <i class="fa-solid fa-user-shield me-1"></i>Admin (admin123)
                </button>
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="fillDemoCredentials('officer')">
                    <i class="fa-solid fa-user-pen me-1"></i>Officer (officer123)
                </button>
            </div>
        </div>

        <div class="text-center mt-4">
            <small class="text-muted">Digital Urban Greenery &copy; 2026. All rights reserved.</small>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
